services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_marketing"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: web-app/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/ai_marketing
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in web-app/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in web-app/.env}
      WORKER_API_KEY: ${WORKER_API_KEY:?Set WORKER_API_KEY in web-app/.env}
      PYTHON_WORKER_URL: http://python-worker:8000
      FRONTEND_URL: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-openai}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4.1}
      SKILLS_ROOT: /repo/skills
      AGENTS_ROOT: /repo/agents
      TEMPLATES_ROOT: /repo/templates
      MARKET_ROOT: /repo/market
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ../skills:/repo/skills:ro
      - ../agents:/repo/agents:ro
      - ../templates:/repo/templates:ro
      - ../market:/repo/market:ro
    command: sh -c "npx prisma db push && npm run dev"

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../scripts:/repo/scripts:ro
    environment:
      PYTHONUNBUFFERED: "1"
      SCRIPTS_DIR: /repo/scripts
      WORKER_API_KEY: ${WORKER_API_KEY:?Set WORKER_API_KEY in web-app/.env}
      REPORT_OUTPUT_DIR: /tmp/aiscripto-reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
